name: PR Metrics
on:
  pull_request_target:
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Install cloc
        run: |
          curl -sL https://raw.githubusercontent.com/AlDanial/cloc/master/cloc -o cloc
          chmod +x cloc
          sudo mv cloc /usr/local/bin/

      - name: Checkout Base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}

      - name: Measure Base
        run: echo "BASE=$(cloc . --include-lang=Rust --json | jq -r '.SUM | "\(.nFiles) \(.blank) \(.comment) \(.code)"')" >> $GITHUB_ENV

      - name: Checkout Head
        uses: actions/checkout@v7

      - name: Measure Head & Format
        run: |
          read B_F B_B B_C B_L <<< "$BASE"
          read A_F A_B A_C A_L <<< $(cloc . --include-lang=Rust --json | jq -r '.SUM | "\(.nFiles) \(.blank) \(.comment) \(.code)"')

          D_L=$(( A_L - B_L ))
          SIGN=$([ $D_L -gt 0 ] && echo "+" || echo "")

          cat <<EOF > loc.md
          ### 📊 Code Metrics (Rust)
          | State | Files | Blank | Comment | Code |
          |---|---|---|---|---|
          | **Before** | $B_F | $B_B | $B_C | $B_L |
          | **After** | $A_F | $A_B | $A_C | $A_L |
          | **Diff** | | | | **$SIGN$D_L** |
          EOF

      - name: Post Sticky Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event.pull_request
        with:
          path: loc.md
