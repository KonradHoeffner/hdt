name: PR Metrics
on:
  pull_request_target:
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Install cloc
        run: |
          curl -sL https://raw.githubusercontent.com/AlDanial/cloc/master/cloc -o cloc
          chmod +x cloc
          sudo mv cloc /usr/local/bin/

      - name: Checkout Base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}

      - name: Measure Base
        run: echo "BASE=$(cloc . --include-lang=Rust --json | jq -r '.SUM | "\(.nFiles) \(.blank) \(.comment) \(.code)"')" >> $GITHUB_ENV

      - name: Checkout Head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          allow-unsafe-pr-checkout: true

      - name: Measure Head & Format
        run: |
          HEAD=$(cloc . --include-lang=Rust --json | jq -r '.SUM | "\(.nFiles) \(.blank) \(.comment) \(.code)"')
          awk -v b="$BASE" -v a="$HEAD" 'BEGIN {
            split(b, B); split(a, A);
            print "### 📊 Code Metrics (Rust)\n| State | Files | Blank | Comment | Code |\n|---|---|---|---|---|\n| **Before** | "B[1]" | "B[2]" | "B[3]" | "B[4]" |\n| **After** | "A[1]" | "A[2]" | "A[3]" | "A[4]" |"
            printf "| **Diff** |"
            for(i=1;i<=4;i++) printf " **%s%d** |", (A[i]>B[i]?"+":""), A[i]-B[i]
            printf "\n| **%% Diff** |"
            for(i=1;i<=4;i++) printf " **%s%.1f%%** |", (A[i]>B[i]?"+":""), B[i]?((A[i]-B[i])/B[i]*100):0
          }' > loc.md

      - name: Post Sticky Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event.pull_request
        with:
          path: loc.md
